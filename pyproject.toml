[project]
name = "mapeando-unir"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.1",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.fastapi]
entrypoint = "app.main:app"
