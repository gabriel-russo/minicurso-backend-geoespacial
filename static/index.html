<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa Colaborativo — Geoinformática</title>

  <link rel="stylesheet" href="/static/vendor/leaflet.css">
  <link rel="stylesheet" href="/static/vendor/leaflet.draw.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topo">
    <div class="titulo">
      <h1>Mapa Colaborativo</h1>
      <p>FastAPI + WebSocket + SpatiaLite</p>
    </div>

    <div class="informacoes">
      <span id="contador" class="contador">0 geometrias</span>
      <span id="status" class="status offline">conectando…</span>
    </div>
  </header>

  <main id="mapa" aria-label="Mapa colaborativo"></main>

  <footer class="rodape">
    <span>Use as ferramentas no canto superior esquerdo para desenhar.</span>
    <span>Clique em uma geometria para ver os detalhes e excluir.</span>
  </footer>

  <script src="/static/vendor/leaflet.js"></script>
  <script src="/static/vendor/leaflet.draw.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
